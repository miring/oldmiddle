<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- %SERVICE_NAME%은 빌드할 때 src/config/site.ts의 서비스명으로 바뀝니다 (vite.config.ts) -->
    <title>%SERVICE_NAME% · 45세 이상 싱글을 위한 동반자 서비스</title>
    <meta
      name="description"
      content="신원과 혼인 상태를 확인한 45세 이상 싱글이 가까운 곳에서 1:1로 편안하게 만날 수 있도록 준비하고 있어요. 10가지 질문으로 나와 잘 맞는 동행을 알아보세요."
    />
    <!-- 카카오톡·문자 등 공유 미리보기 -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="%SERVICE_NAME%" />
    <meta property="og:title" content="%SERVICE_NAME% · 나와 잘 맞는 사람과 편안하게 커피 한 잔" />
    <meta
      property="og:description"
      content="45세 이상 싱글을 위한 10가지 질문. 나와 잘 맞는 동행을 알아보세요. 가입 없이 결과를 확인할 수 있어요."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 휴대폰 주소창 색 (tokens.css --color-bg-default와 같은 값) -->
    <meta name="theme-color" content="#fafaf7" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
